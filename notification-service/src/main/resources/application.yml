erver:
  port: 8083

notification:
  email:
    provider: smtp
    providers:
      smtp:
        host: smtp.gmail.com
        port: 587
        username: your-email@gmail.com
        password: your-password
        properties:
          mail:
            smtp:
              auth: true
              starttls:
                enable: true
      sendgrid:
        api-key: your-sendgrid-api-key
        from-email: your-email@example.com

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  prometheus:
    metrics:
      export:
        enabled: true

resilience4j:
  retry:
    instances:
      emailNotification:
        max-attempts: 3
        wait-duration: 1s
        exponential-backoff-multiplier: 2
      smsNotification:
        max-attempts: 3
        wait-duration: 500ms
      webhookNotification:
        max-attempts: 3
        wait-duration: 2s
        exponential-backoff-multiplier: 2

logging:
  level:
    com.paymentprocessor.notification: INFO
    org.springframework.kafka: WARN
    org.springframework.mail: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [%X{correlationId:-}] %logger{36} - %msg%n"
